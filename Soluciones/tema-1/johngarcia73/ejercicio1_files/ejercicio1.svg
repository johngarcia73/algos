<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
<title id="title">Aumento estimado del tamaño de entrada resoluble</title>
<desc id="desc">Con un presupuesto mil veces mayor, el tamaño resoluble se multiplica aproximadamente por 31.6 para un algoritmo cuadrático y por 791 para uno n log n.</desc>
<style>
  text { font-family: Arial, Helvetica, sans-serif; fill: #263238; }
  .small { font-size: 14px; }
  .label { font-size: 17px; font-weight: 600; }
  .tick { stroke: #75818a; stroke-width: 1.2; }
  .axis { stroke: #263238; stroke-width: 2; }
  .grid { stroke: #dce2e6; stroke-width: 1; stroke-dasharray: 3 5; }
</style>
<text x="450" y="25" text-anchor="middle" font-size="19" font-weight="700">Factor de aumento del tamaño de entrada</text>
<line class="axis" x1="190" y1="205" x2="820" y2="205"/>
<g class="small" text-anchor="middle">
  <line class="tick" x1="190" y1="199" x2="190" y2="211"/><text x="190" y="230">10</text>
  <line class="tick" x1="348" y1="199" x2="348" y2="211"/><text x="348" y="230">30</text>
  <line class="tick" x1="505" y1="199" x2="505" y2="211"/><text x="505" y="230">100</text>
  <line class="tick" x1="663" y1="199" x2="663" y2="211"/><text x="663" y="230">300</text>
  <line class="tick" x1="820" y1="199" x2="820" y2="211"/><text x="820" y="230">1000</text>
</g>
<g class="grid">
  <line x1="190" y1="50" x2="190" y2="205"/><line x1="348" y1="50" x2="348" y2="205"/><line x1="505" y1="50" x2="505" y2="205"/><line x1="663" y1="50" x2="663" y2="205"/><line x1="820" y1="50" x2="820" y2="205"/>
</g>
<text class="label" x="20" y="91">Θ(n²)</text>
<text class="label" x="20" y="151">Θ(n log n)</text>
<line x1="190" y1="85" x2="349" y2="85" stroke="#176B87" stroke-width="8" stroke-linecap="round"/>
<circle cx="349" cy="85" r="7" fill="#176B87"/>
<text x="360" y="78" font-size="17" font-weight="700" fill="#176B87">31.6×</text>
<line x1="190" y1="145" x2="804" y2="145" stroke="#24856B" stroke-width="8" stroke-linecap="round"/>
<circle cx="804" cy="145" r="7" fill="#24856B"/>
<text x="795" y="132" text-anchor="end" font-size="17" font-weight="700" fill="#24856B">791×</text>
<text x="505" y="249" text-anchor="middle" font-size="12" fill="#59636E">Escala horizontal logarítmica</text>
</svg>
