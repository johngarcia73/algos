<svg xmlns="http://www.w3.org/2000/svg" width="900" height="245" viewBox="0 0 900 245" role="img" aria-labelledby="title desc">
<title id="title">Búsqueda binaria en un arreglo de siete elementos</title>
<desc id="desc">Se busca 15 en 2, 5, 8, 12, 16, 23, 38. Los pivotes comparados son 12, 23 y 16. El objetivo queda en el hueco entre 12 y 16.</desc>
<style>
 text { font-family: Arial, Helvetica, sans-serif; fill: #263238; }
 .cell { fill: #f4f6f8; stroke: #87939c; stroke-width: 1.5; }
 .v1 { fill: #eaf4f7; stroke: #176B87; stroke-width: 3; }
 .v2 { fill: #fff3e4; stroke: #c77924; stroke-width: 3; }
 .v3 { fill: #eaf5f0; stroke: #24856B; stroke-width: 3; }
 .num { font-size: 21px; font-weight: 600; text-anchor: middle; }
 .annot { font-size: 15px; font-weight: 600; }
 .muted { fill: #59636e; font-size: 13px; }
</style>
<text x="450" y="25" font-size="19" font-weight="700" text-anchor="middle">Buscar x = 15 en A = (2, 5, 8, 12, 16, 23, 38)</text>
<g transform="translate(80,78)">
  <rect class="cell" x="0" y="0" width="90" height="54" rx="6"/><text class="num" x="45" y="34">2</text>
  <rect class="cell" x="96" y="0" width="90" height="54" rx="6"/><text class="num" x="141" y="34">5</text>
  <rect class="cell" x="192" y="0" width="90" height="54" rx="6"/><text class="num" x="237" y="34">8</text>
  <rect class="v1" x="288" y="0" width="90" height="54" rx="6"/><text class="num" x="333" y="34">12</text>
  <rect class="v3" x="384" y="0" width="90" height="54" rx="6"/><text class="num" x="429" y="34">16</text>
  <rect class="v2" x="480" y="0" width="90" height="54" rx="6"/><text class="num" x="525" y="34">23</text>
  <rect class="cell" x="576" y="0" width="90" height="54" rx="6"/><text class="num" x="621" y="34">38</text>
  <g class="muted" text-anchor="middle">
    <text x="45" y="75">a₁</text><text x="141" y="75">a₂</text><text x="237" y="75">a₃</text><text x="333" y="75">a₄</text><text x="429" y="75">a₅</text><text x="525" y="75">a₆</text><text x="621" y="75">a₇</text>
  </g>
  <path d="M333,-8 L333,-26" stroke="#176B87" stroke-width="2"/><text class="annot" x="333" y="-34" text-anchor="middle" fill="#176B87">1: compara 12</text>
  <path d="M525,-8 L525,-26" stroke="#c77924" stroke-width="2"/><text class="annot" x="525" y="-34" text-anchor="middle" fill="#c77924">2: compara 23</text>
  <path d="M429,62 L429,91" stroke="#24856B" stroke-width="2"/><text class="annot" x="429" y="111" text-anchor="middle" fill="#24856B">3: compara 16</text>
  <path d="M378,141 L384,141" stroke="#176B87" stroke-width="2"/><path d="M378,135 L378,147 M384,135 L384,147" stroke="#176B87" stroke-width="2"/>
  <text x="381" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#176B87">x = 15 cae en este hueco</text>
</g>
<text x="80" y="225" class="muted">Intervalos candidatos: [0,7) → [4,7) → [4,5) → ∅</text>
</svg>
