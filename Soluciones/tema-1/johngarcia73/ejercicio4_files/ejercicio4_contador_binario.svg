<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
  <title id="title">Incremento de un contador binario en una máquina de Turing</title>
  <desc id="desc">La cinta almacena primero el bit menos significativo. El acarreo transforma tres unos en ceros, escribe un uno en el blanco siguiente y el cabezal regresa al bit menos significativo.</desc>
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#b64b4b"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#24856b"/></marker>
    <style>
      .label{font: bold 25px sans-serif;fill:#176b87}.bit{font: bold 27px sans-serif;fill:#263238}.small{font:18px sans-serif;fill:#59636e}.cell{stroke:#64717d;stroke-width:2;rx:9;ry:9}.lsb{fill:#eaf4f7;stroke:#176b87;stroke-width:3}.changed{fill:#eaf5f0;stroke:#24856b;stroke-width:2}.blank{fill:#f2f4f6;stroke:#9aa4ae;stroke-width:2}.red{font:bold 19px sans-serif;fill:#b64b4b}.green{font:bold 19px sans-serif;fill:#24856b}
    </style>
  </defs>
  <text x="35" y="48" class="label">Antes del incremento</text>
  <g transform="translate(250,80)">
    <rect class="cell lsb" x="0" y="0" width="82" height="65"/><text class="bit" x="41" y="43" text-anchor="middle">1</text>
    <rect class="cell" x="94" y="0" width="82" height="65" fill="#fff"/><text class="bit" x="135" y="43" text-anchor="middle">1</text>
    <rect class="cell" x="188" y="0" width="82" height="65" fill="#fff"/><text class="bit" x="229" y="43" text-anchor="middle">1</text>
    <rect class="cell blank" x="282" y="0" width="82" height="65"/><text class="bit" x="323" y="43" text-anchor="middle">□</text>
    <text class="small" x="41" y="91" text-anchor="middle">LSB</text>
    <path d="M42,-14 L323,-14" stroke="#b64b4b" stroke-width="4" fill="none" marker-end="url(#arrowRed)"/>
    <text class="red" x="183" y="-27" text-anchor="middle">acarreo: recorrer los unos</text>
    <text class="small" x="410" y="39">111₂</text>
    <text class="small" x="410" y="62">(LSB primero)</text>
  </g>
  <text x="35" y="220" class="label">Después de sumar 1</text>
  <g transform="translate(250,245)">
    <rect class="cell changed" x="0" y="0" width="82" height="65"/><text class="bit" x="41" y="43" text-anchor="middle">0</text>
    <rect class="cell changed" x="94" y="0" width="82" height="65"/><text class="bit" x="135" y="43" text-anchor="middle">0</text>
    <rect class="cell changed" x="188" y="0" width="82" height="65"/><text class="bit" x="229" y="43" text-anchor="middle">0</text>
    <rect class="cell changed" x="282" y="0" width="82" height="65"/><text class="bit" x="323" y="43" text-anchor="middle">1</text>
    <path d="M323,88 L42,88" stroke="#24856b" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
    <text class="green" x="183" y="119" text-anchor="middle">regreso del cabezal al LSB</text>
    <text class="small" x="410" y="39">1000₂</text>
    <text class="small" x="410" y="62">(valor representado)</text>
  </g>
</svg>
