<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
<title id="t">Mezcla con dos elementos finales no comparados</title>
<desc id="d">Dos listas ordenadas A y B. La variante consume los primeros elementos hasta dejar 7 y 8 sin comparar, y los coloca en el orden incorrecto 8, 7.</desc>
<defs>
  <style>
    .txt{font-family:Arial,Helvetica,sans-serif;fill:#243447}.small{font-size:16px}.label{font-size:19px;font-weight:700}
    .cell{stroke-width:2;rx:9;ry:9}.a{fill:#eef5fb;stroke:#32658a}.b{fill:#edf8f2;stroke:#26845b}
    .tail{fill:#fff0f0;stroke:#b44343;stroke-width:2.5}.muted{fill:#657383;font-size:15px}
  </style>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#b44343" stroke-width="1.5"/></marker>
</defs>
<rect x="1" y="1" width="958" height="298" rx="16" fill="#ffffff" stroke="#d7dee7"/>
<text x="34" y="66" class="txt label">A</text><text x="34" y="132" class="txt label">B</text>
<g class="txt" text-anchor="middle" font-size="21">
 <rect x="92" y="35" width="115" height="48" class="cell a"/><text x="149" y="66">4</text>
 <rect x="220" y="35" width="115" height="48" class="cell a"/><text x="277" y="66">5</text>
 <rect x="348" y="35" width="115" height="48" class="cell a"/><text x="405" y="66">6</text>
 <rect x="476" y="35" width="115" height="48" class="cell tail"/><text x="533" y="66" font-weight="700" fill="#a52d2d">7</text>
 <rect x="92" y="101" width="115" height="48" class="cell b"/><text x="149" y="132">1</text>
 <rect x="220" y="101" width="115" height="48" class="cell b"/><text x="277" y="132">2</text>
 <rect x="348" y="101" width="115" height="48" class="cell b"/><text x="405" y="132">3</text>
 <rect x="476" y="101" width="115" height="48" class="cell tail"/><text x="533" y="132" font-weight="700" fill="#a52d2d">8</text>
</g>
<path d="M620 56 h20 v72 h-20" fill="none" stroke="#b44343" stroke-width="2.5"/>
<text x="656" y="78" class="txt small" fill="#a52d2d">Últimos elementos</text>
<text x="656" y="100" class="txt small" fill="#a52d2d">sin comparar: (7, 8)</text>
<path d="M535 153 C535 185 644 184 690 203" fill="none" stroke="#b44343" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="34" y="229" class="txt small" font-weight="700">Cola ordenada correcta</text>
<text x="34" y="258" class="txt small">… 6, 7, 8</text>
<text x="485" y="229" class="txt small" font-weight="700">Salida de la variante</text>
<text x="485" y="258" class="txt small" fill="#a52d2d">… 6, 8, 7</text>
<text x="932" y="280" class="muted" text-anchor="end">Ejemplo: n = 4</text>
</svg>